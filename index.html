<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyBrain</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }
    header {
      background: #ffffff;
      text-align: center;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #1a7f37;
    }
    .logo span { color: #333; }
    .liste {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      padding: 16px;
    }
    .carte {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }
    .photo {
      width: 100%;
      height: 160px;
      background: #d9e8dd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }
    .photo img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }
    .infos { padding: 12px; }
    .nom { font-size: 18px; font-weight: bold; margin: 0 0 6px; }
    .categorie { font-size: 13px; color: #666; margin: 0 0 6px; }
    .prix { font-size: 17px; color: #1a7f37; font-weight: bold; margin: 0 0 12px; }
    .btn-acheter {
      width: 100%;
      padding: 12px;
      background: #1a7f37;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 14px;
      box-shadow: 0 5px 0 #0f5a25;
      cursor: pointer;
    }
    .btn-acheter:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #0f5a25;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">My<span>Brain</span></div>
  </header>

  <div class="liste" id="liste"></div>

  <script>
    // Pwodui egzanp yo. Nou pral ranplase yo pita.
    var produits = [
      { nom: "Guide PDF Débutant", prix: "500 HTG", categorie: "PDF", photo: "" },
      { nom: "Cours de Prompt Engineering", prix: "1500 HTG", categorie: "Cours", photo: "" },
      { nom: "Pack Modèles CV", prix: "300 HTG", categorie: "PDF", photo: "" }
    ];

    var liste = document.getElementById("liste");

    produits.forEach(function (p) {
      var photoHtml = p.photo
        ? '<img src="' + p.photo + '" alt="' + p.nom + '">'
        : "📚";

      liste.innerHTML +=
        '<div class="carte">' +
          '<div class="photo">' + photoHtml + '</div>' +
          '<div class="infos">' +
            '<p class="nom">' + p.nom + '</p>' +
            '<p class="categorie">' + p.categorie + '</p>' +
            '<p class="prix">' + p.prix + '</p>' +
            '<button class="btn-acheter">Acheter</button>' +
          '</div>' +
        '</div>';
    });
  </script>

</body>
</html>
