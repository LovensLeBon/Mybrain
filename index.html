<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyBrain</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
    header { background: #fff; text-align: center; padding: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .logo { font-size: 28px; font-weight: bold; color: #1a7f37; }
    .logo span { color: #333; }
    #deco { display: none; margin-top: 6px; font-size: 13px; color: #666; text-decoration: underline; cursor: pointer; }
    .liste { display: grid; grid-template-columns: 1fr; gap: 16px; padding: 16px; }
    .carte { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
    .photo { width: 100%; height: 160px; background: #d9e8dd; display: flex; align-items: center; justify-content: center; font-size: 48px; }
    .photo img { width: 100%; height: 160px; object-fit: cover; }
    .infos { padding: 12px; }
    .nom { font-size: 18px; font-weight: bold; margin: 0 0 6px; }
    .categorie { font-size: 13px; color: #666; margin: 0 0 6px; }
    .prix { font-size: 17px; color: #1a7f37; font-weight: bold; margin: 0 0 12px; }
    .btn-acheter, .btn-principal {
      width: 100%; padding: 12px; background: #1a7f37; color: #fff;
      font-size: 16px; font-weight: bold; border: none; border-radius: 14px;
      box-shadow: 0 5px 0 #0f5a25; cursor: pointer;
    }
    .btn-acheter:active, .btn-principal:active { transform: translateY(4px); box-shadow: 0 1px 0 #0f5a25; }
    #fond { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); align-items: center; justify-content: center; padding: 16px; z-index: 10; }
    .boite { background: #fff; border-radius: 14px; padding: 20px; width: 100%; max-width: 380px; position: relative; }
    .boite h2 { margin: 0 0 6px; color: #1a7f37; }
    .boite p.sous { margin: 0 0 14px; color: #555; font-size: 14px; }
    .boite input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
    .champ { position: relative; margin-bottom: 10px; }
    .champ input { margin-bottom: 0; padding-right: 48px; }
    .champ input.rouge { border: 2px solid #c62828; background: #fdecea; }
    .oeil { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 22px; line-height: 1; padding: 6px; cursor: pointer; }
    @keyframes souke {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(8px); }
    }
    .souke { animation: souke 0.4s; }
    #erreur { color: #c62828; font-size: 14px; min-height: 18px; margin: 0 0 10px; }
    #bascule { text-align: center; margin-top: 14px; font-size: 14px; color: #1a7f37; text-decoration: underline; cursor: pointer; }
    #fermer { position: absolute; top: 8px; right: 14px; font-size: 24px; cursor: pointer; color: #888; }
    #message { display: none; position: fixed; bottom: 20px; left: 16px; right: 16px; background: #1a7f37; color: #fff; padding: 14px; border-radius: 10px; text-align: center; z-index: 20; }

    #feuille { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 15; align-items: flex-end; justify-content: center; }
    .feuille-boite {
      background: #fff; width: 100%; max-width: 480px; max-height: 92vh; overflow-y: auto;
      border-radius: 20px 20px 0 0; padding: 22px 20px 26px; position: relative;
      transform: translateY(100%); transition: transform 0.3s ease;
    }
    #feuille.ouvert .feuille-boite { transform: translateY(0); }
    .feuille-boite h2 { margin: 0 0 6px; color: #1a7f37; font-size: 22px; }
    .feuille-boite p.sous { margin: 0 0 20px; color: #555; font-size: 14px; }
    #pfermer { position: absolute; top: 10px; right: 16px; font-size: 28px; cursor: pointer; color: #888; line-height: 1; }
    .btn-moncash, .btn-natcash {
      display: block; width: 100%; padding: 16px; margin-bottom: 18px;
      color: #fff; font-size: 18px; font-weight: bold; border: none; border-radius: 16px; cursor: pointer;
    }
    .btn-moncash { background: #d32f2f; box-shadow: 0 6px 0 #8e1c1c; }
    .btn-natcash { background: #0d2f6e; box-shadow: 0 6px 0 #071b40; }
    .btn-moncash:active { transform: translateY(5px); box-shadow: 0 1px 0 #8e1c1c; }
    .btn-natcash:active { transform: translateY(5px); box-shadow: 0 1px 0 #071b40; }
    #retour { color: #1a7f37; text-decoration: underline; cursor: pointer; font-size: 14px; margin-bottom: 10px; }
    .montant { background: #eaf5ee; border-radius: 10px; padding: 10px 14px; margin: 10px 0 16px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #333; }
    .montant b { font-size: 19px; color: #1a7f37; }
    .etapes { padding-left: 20px; margin: 0 0 20px; }
    .etapes li { margin-bottom: 14px; line-height: 1.6; font-size: 15px; color: #333; }
    .kopye { display: inline-block; margin-left: 4px; padding: 4px 10px; font-size: 12px; border: 1px solid #1a7f37; background: #fff; color: #1a7f37; border-radius: 8px; cursor: pointer; }
    .lien-wa { display: block; text-align: center; text-decoration: none; }
  </style>
</head>
<body>

  <header>
    <div class="logo">My<span>Brain</span></div>
    <div id="deco">Se déconnecter</div>
  </header>

  <div class="liste" id="liste"></div>

  <div id="fond">
    <div class="boite">
      <span id="fermer">&times;</span>
      <h2 id="titre"></h2>
      <p class="sous" id="sous"></p>
      <input type="email" id="email" placeholder="Adresse e-mail">

      <div class="champ" id="champ1">
        <input type="password" id="mdp" placeholder="Mot de passe (6 caractères minimum)">
        <button type="button" class="oeil" id="oeil">👁️</button>
      </div>

      <div class="champ" id="champ2">
        <input type="password" id="mdp2" placeholder="Confirmer le mot de passe">
      </div>

      <p id="erreur"></p>
      <button class="btn-principal" id="valider"></button>
      <div id="bascule"></div>
    </div>
  </div>

  <div id="feuille">
    <div class="feuille-boite">
      <span id="pfermer">&times;</span>

      <div id="vue-choix">
        <h2>Chwazi yon mwayen paiement</h2>
        <p class="sous" id="pnom"></p>
        <button type="button" class="btn-moncash" id="btn-moncash">MonCash</button>
        <button type="button" class="btn-natcash" id="btn-natcash">Natcash</button>
      </div>

      <div id="vue-detail" style="display:none">
        <div id="retour">&larr; Retounen</div>
        <h2 id="dtitre"></h2>
        <div class="montant"><span>Montan pou voye</span><b id="dmontant"></b></div>
        <ol class="etapes">
          <li>Voye <b id="dmontant2"></b> sou nimewo <b id="dnumero"></b> <button type="button" class="kopye" id="kopye">Kopye nimewo</button></li>
          <li>Non kont lan: <b id="dcompte"></b></li>
          <li>Pran yon foto (screenshot) ki montre tranzaksyon an fèt</li>
          <li>Voye foto a sou WhatsApp <b id="dwa"></b></li>
        </ol>
        <a class="btn-principal lien-wa" id="lien-wa" target="_blank" rel="noopener">Voye prèv la sou WhatsApp</a>
      </div>
    </div>
  </div>

  <div id="message"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyAohyvle5aqT4oQ0UIkDAXI6KEntpGvCRU",
      authDomain: "mybrain-fdbe8.firebaseapp.com",
      projectId: "mybrain-fdbe8",
      storageBucket: "mybrain-fdbe8.firebasestorage.app",
      messagingSenderId: "543483595565",
      appId: "1:543483595565:web:e658c935919b8f238f61a4"
    };
    firebase.initializeApp(firebaseConfig);
    var auth = firebase.auth();

    var produits = [
      { nom: "Guide PDF Débutant", prix: "500 HTG", categorie: "PDF", photo: "" },
      { nom: "Cours de Prompt Engineering", prix: "1500 HTG", categorie: "Cours", photo: "" },
      { nom: "Pack Modèles CV", prix: "300 HTG", categorie: "PDF", photo: "" }
    ];

    var WA_NUMERO = "50935646494";
    var WA_AFFICHE = "+509 35 64 6494";
    var moyens = {
      moncash: { nom: "MonCash", numero: "+509 37 65 0486", local: "37650486", compte: "SANON Lovensky" },
      natcash: { nom: "Natcash", numero: "+509 35 64 6494", local: "35646494", compte: "DANON Lovensky" }
    };

    var produitChoisi = null;
    var moyenChoisi = null;
    var mode = "inscription";

    var liste = document.getElementById("liste");
    produits.forEach(function (p, i) {
      var photoHtml = p.photo ? '<img src="' + p.photo + '" alt="' + p.nom + '">' : "📚";
      liste.innerHTML +=
        '<div class="carte">' +
          '<div class="photo">' + photoHtml + '</div>' +
          '<div class="infos">' +
            '<p class="nom">' + p.nom + '</p>' +
            '<p class="categorie">' + p.categorie + '</p>' +
            '<p class="prix">' + p.prix + '</p>' +
            '<button class="btn-acheter" data-i="' + i + '">Acheter</button>' +
          '</div>' +
        '</div>';
    });

    liste.addEventListener("click", function (e) {
      if (e.target.classList.contains("btn-acheter")) {
        produitChoisi = produits[e.target.getAttribute("data-i")];
        if (auth.currentUser) {
          ouvrirPaiement();
        } else {
          mode = "inscription";
          ouvrirFenetre();
        }
      }
    });

    function ouvrirFenetre() {
      document.getElementById("erreur").textContent = "";
      document.getElementById("mdp2").classList.remove("rouge");
      document.getElementById("mdp").type = "password";
      document.getElementById("oeil").textContent = "👁️";
      if (mode === "inscription") {
        document.getElementById("titre").textContent = "Créer un compte";
        document.getElementById("sous").textContent = "Créez un compte pour protéger votre achat";
        document.getElementById("valider").textContent = "Créer mon compte";
        document.getElementById("bascule").textContent = "Déjà un compte ? Se connecter";
        document.getElementById("champ2").style.display = "block";
      } else {
        document.getElementById("titre").textContent = "Se connecter";
        document.getElementById("sous").textContent = "Entrez vos informations";
        document.getElementById("valider").textContent = "Se connecter";
        document.getElementById("bascule").textContent = "Pas de compte ? Créer un compte";
        document.getElementById("champ2").style.display = "none";
      }
      document.getElementById("fond").style.display = "flex";
    }

    function fermerFenetre() {
      document.getElementById("fond").style.display = "none";
    }

    document.getElementById("fermer").onclick = fermerFenetre;

    document.getElementById("bascule").onclick = function () {
      mode = (mode === "inscription") ? "connexion" : "inscription";
      ouvrirFenetre();
    };

    document.getElementById("oeil").onclick = function () {
      var champ = document.getElementById("mdp");
      if (champ.type === "password") {
        champ.type = "text";
        this.textContent = "🙈";
      } else {
        champ.type = "password";
        this.textContent = "👁️";
      }
    };

    function effacerRouge() {
      document.getElementById("mdp2").classList.remove("rouge");
      document.getElementById("erreur").textContent = "";
    }
    document.getElementById("mdp").addEventListener("input", effacerRouge);
    document.getElementById("mdp2").addEventListener("input", effacerRouge);

    function montrerMessage(texte) {
      var m = document.getElementById("message");
      m.textContent = texte;
      m.style.display = "block";
      setTimeout(function () { m.style.display = "none"; }, 3500);
    }

    function montrerVue(v) {
      document.getElementById("vue-choix").style.display = (v === "choix") ? "block" : "none";
      document.getElementById("vue-detail").style.display = (v === "detail") ? "block" : "none";
    }

    function ouvrirPaiement() {
      document.getElementById("pnom").textContent = produitChoisi.nom + " · " + produitChoisi.prix;
      montrerVue("choix");
      var f = document.getElementById("feuille");
      f.style.display = "flex";
      setTimeout(function () { f.classList.add("ouvert"); }, 20);
    }

    function fermerPaiement() {
      var f = document.getElementById("feuille");
      f.classList.remove("ouvert");
      setTimeout(function () { f.style.display = "none"; }, 300);
    }

    function montrerDetail(cle) {
      var m = moyens[cle];
      moyenChoisi = m;
      document.getElementById("dtitre").textContent = "Peye ak " + m.nom;
      document.getElementById("dmontant").textContent = produitChoisi.prix;
      document.getElementById("dmontant2").textContent = produitChoisi.prix;
      document.getElementById("dnumero").textContent = m.numero;
      document.getElementById("dcompte").textContent = m.compte;
      document.getElementById("dwa").textContent = WA_AFFICHE;

      var email = auth.currentUser ? auth.currentUser.email : "";
      var texte = "Bonjou, mwen vle peye " + produitChoisi.prix +
        " pou \"" + produitChoisi.nom + "\" ak " + m.nom + ". èske nap ka voye l pa WhatsApp pou mwen." +
        (email ? " Imèl kont mwen: " + email : "");
      document.getElementById("lien-wa").href = "https://wa.me/" + WA_NUMERO + "?text=" + encodeURIComponent(texte);

      document.getElementById("kopye").textContent = "Kopye nimewo";
      montrerVue("detail");
    }

    function copierAncien(texte) {
      var t = document.createElement("textarea");
      t.value = texte;
      document.body.appendChild(t);
      t.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(t);
    }

    document.getElementById("btn-moncash").onclick = function () { montrerDetail("moncash"); };
    document.getElementById("btn-natcash").onclick = function () { montrerDetail("natcash"); };
    document.getElementById("retour").onclick = function () { montrerVue("choix"); };
    document.getElementById("pfermer").onclick = fermerPaiement;

    document.getElementById("feuille").addEventListener("click", function (e) {
      if (e.target === this) fermerPaiement();
    });

    document.getElementById("kopye").onclick = function () {
      var bouton = this;
      var numero = moyenChoisi.local;
      var fini = function () {
        bouton.textContent = "Kopye";
        setTimeout(function () { bouton.textContent = "Kopye nimewo"; }, 1500);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(numero).then(fini).catch(function () {
          copierAncien(numero);
          fini();
        });
      } else {
        copierAncien(numero);
        fini();
      }
    };

    function texteErreur(code) {
      if (code === "auth/email-already-in-use") return "Cet e-mail est déjà utilisé.";
      if (code === "auth/weak-password") return "Mot de passe trop court (6 caractères minimum).";
      if (code === "auth/invalid-email") return "Adresse e-mail invalide.";
      if (code === "auth/network-request-failed") return "Pas de connexion internet.";
      if (code === "auth/invalid-credential" || code === "auth/wrong-password" || code === "auth/user-not-found") return "E-mail ou mot de passe incorrect.";
      return "Une erreur est survenue. Réessayez.";
    }

    document.getElementById("valider").onclick = function () {
      var email = document.getElementById("email").value.trim();
      var mdp = document.getElementById("mdp").value;
      var mdp2 = document.getElementById("mdp2").value;
      var erreur = document.getElementById("erreur");
      var bouton = document.getElementById("valider");

      if (!navigator.onLine) { erreur.textContent = "Pas de connexion internet."; return; }
      if (!email || mdp.length < 6) {
        erreur.textContent = "Entrez un e-mail et un mot de passe de 6 caractères minimum.";
        return;
      }

      if (mode === "inscription" && mdp !== mdp2) {
        erreur.textContent = "Les mots de passe sont différents. Assurez-vous que les deux mots de passe sont identiques.";
        var champ1 = document.getElementById("champ1");
        champ1.classList.remove("souke");
        void champ1.offsetWidth;
        champ1.classList.add("souke");
        document.getElementById("mdp2").classList.add("rouge");
        return;
      }

      erreur.textContent = "";
      bouton.disabled = true;
      bouton.textContent = "Chargement...";

      var action = (mode === "inscription")
        ? auth.createUserWithEmailAndPassword(email, mdp)
        : auth.signInWithEmailAndPassword(email, mdp);

      action.then(function () {
        fermerFenetre();
        document.getElementById("email").value = "";
        document.getElementById("mdp").value = "";
        document.getElementById("mdp2").value = "";
        if (produitChoisi) ouvrirPaiement();
        else montrerMessage("Connecté.");
      }).catch(function (e) {
        erreur.textContent = texteErreur(e.code);
      }).then(function () {
        bouton.disabled = false;
        bouton.textContent = (mode === "inscription") ? "Créer mon compte" : "Se connecter";
      });
    };

    auth.onAuthStateChanged(function (user) {
      document.getElementById("deco").style.display = user ? "block" : "none";
    });

    document.getElementById("deco").onclick = function () {
      auth.signOut();
    };
  </script>

</body>
</html>
